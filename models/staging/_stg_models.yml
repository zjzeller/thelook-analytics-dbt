version: 2

models:
  - name: stg_orders
    columns:
      - name: order_id
        tests:
          - not_null
          - unique
      - name: user_id
        tests:
          - relationships:
              arguments:
                to: ref('stg_users')
                field: user_id
      - name: status
        tests:
          - accepted_values:
              arguments:
                values: ['Processing', 'Shipped', 'Complete', 'Returned', 'Cancelled']

  - name: stg_users
    columns:
      - name: user_id
        tests:
          - not_null
          - unique

  - name: stg_order_items
    columns:
      - name: order_item_id
        tests:
          - not_null
          - unique
